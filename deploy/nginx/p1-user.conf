pid /tmp/second-brain-user-nginx.pid;
error_log /dev/stderr crit;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # The container is host-networked by the private staging launcher.
        # It deliberately remains loopback-only; ngrok is the sole optional
        # public transport and is never started by this image.
        listen 127.0.0.1:8082;
        server_name 127.0.0.1 localhost;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Defence in depth: the User entry point never forwards Admin routes,
        # even though the API itself also applies JWT, RBAC and step-up guards.
        location = /api/admin { return 404; }
        location ^~ /api/admin/ { return 404; }

        # Preserve the /api prefix and authentication headers for the User API.
        location ~ ^/api(?:/|$) {
            proxy_pass http://127.0.0.1:3106;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_cache off;
        }

        location ~ /\. { return 404; }

        location ~* \.(?:js|mjs|css|json|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|mp3|wav|mp4|wasm|map)$ {
            try_files $uri =404;
            add_header Cache-Control no-cache;
        }

        # Expo web.output=single: User routes resolve to the static shell.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-store;
        }
    }
}
